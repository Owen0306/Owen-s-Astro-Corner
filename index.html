
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owen's Astro Corner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Header */
    header {
      text-align: center;
      padding: 65px 20px 50px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0 0 15px;
    }

    h2 {
      font-size: 17px;
      font-weight: 400;
      color: #aab6d0;
      margin: 0;
    }

    /* Image container */
    .content {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 15px 60px;
    }

    /* Full-page images */
    .page-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 16px;
      background: white;
    }

    /* Mobile */
    @media (max-width: 600px) {
      header {
        padding: 45px 15px 35px;
      }

      .content {
        padding: 0 5px 40px;
      }

      .page-image {
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Owen's Astro Corner</h1>
    <h2>updated in October 2026</h2>
  </header>

  <main class="content">
